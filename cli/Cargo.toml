[package]
name = "modus-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "modus"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
modus-sign = { path = "../sign" }
pathdiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
native-tls = "0.2"
tungstenite = { version = "0.26", features = ["native-tls"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "io-util"] }
tonic = { version = "0.12", features = ["transport", "tls", "tls-roots"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
bytes = "1"
tower = "0.5"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
wasmparser = "0.227"
wasmtime = { version = "36", features = ["component-model"] }
wit-component = "0.227"
zip = { version = "2", default-features = false, features = ["deflate"] }
getrandom = "0.3"

[dev-dependencies]
modus-sign = { path = "../sign" }
tempfile = "3"
wasmparser = "0.227"
zip = { version = "2", default-features = false, features = ["deflate"] }

